<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitcoin-Lexikon · Satsland</title>
<meta name="description" content="Alle wichtigen Bitcoin-Begriffe einfach erklärt: Node, Block, Seed, UTXO, Halving, Mempool und mehr.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bitcoin-Lexikon · Satsland">
<meta property="og:description" content="Alle wichtigen Bitcoin-Begriffe einfach erklärt: Node, Block, Seed, UTXO, Halving, Mempool und mehr.">
<meta property="og:image" content="https://satsland.github.io/og.png">
<meta property="og:url" content="https://satsland.github.io/lexikon/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../lern.css?v=52">
<style>
/* Lexikon: Suche, Buchstaben-Leiste, aufklappbare Einträge */
.search{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#0b0f2a;color:var(--ink);font:16px var(--f-body)}
.search:focus{outline:none;border-color:var(--gold)}
.abc{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px} .abc a{min-width:28px;text-align:center;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--ink);text-decoration:none;font:800 13px var(--f-num)}
.abc a.off{opacity:.25;pointer-events:none}
.ltr{margin:16px 0 6px;font:900 22px var(--f-display);color:var(--gold)}
.term{border:1px solid var(--line);border-radius:14px;margin-top:8px;background:rgba(255,255,255,.03)}
.term summary{list-style:none;cursor:pointer;padding:12px 14px;font:900 16px var(--f-display);display:flex;align-items:center;gap:8px}
.term summary::-webkit-details-marker{display:none} .term summary::after{content:"+";margin-left:auto;color:var(--gold);font-size:20px} .term[open] summary::after{content:"−"}
.term[open]{border-color:rgba(255,201,77,.45)}
.term p{margin:0;padding:0 14px 12px;font-size:15px;line-height:1.55;color:var(--muted)} .term p a{color:var(--gold);font-weight:800}
.none{margin-top:12px;color:var(--muted)}
</style>
<style>html{background:#0b0f2a;color-scheme:dark}</style><script>document.documentElement.classList.add("boot")</script>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Satsland</a><a class="back" href="../lexikon/">📖 Lexikon</a></div>
  <div>
    <h1>Bitcoin-<span class="btc">Lexikon</span></h1>
    <p class="lead">Alle wichtigen Begriffe, einfach erklärt. Tipp: In jeder Welt sind diese Wörter <b style="border-bottom:2px dotted var(--gold)">gepunktet unterstrichen</b>. Antippen zeigt die Erklärung.</p>
  </div>
  <section class="card" aria-label="Lexikon">
    <input class="search" id="q" type="search" placeholder="🔎 Begriff suchen, z. B. Node" aria-label="Begriff suchen">
    <nav class="abc" id="abc" aria-label="Buchstaben"></nav>
    <div id="list"></div>
  </section>
  <p class="foot">Lernen und Unterhaltung, keine Anlageberatung.</p>
</div>
<script src="../lern.js?v=53"></script>
<script>
/* Lexikon: alle Begriffe aus Lern.GLOSSAR, alphabetisch, mit Suche */
(() => {
const $ = id => document.getElementById(id);
const G = [...Lern.GLOSSAR].sort((a, b) => a[0].localeCompare(b[0], "de")), letter = t => t[0].toUpperCase().replace(/[0-9]/, "#");
const TITLE = Object.fromEntries(Object.entries(Lern.TITLES).map(([k, v]) => [k, v[0]]));
function draw(q = ""){
  const ql = q.toLowerCase(), byName = G.filter(g => g[0].toLowerCase().includes(ql));   // erst im Begriff suchen, sonst in den Erklärungen
  const f = !q ? G : byName.length ? byName : G.filter(g => g[2].toLowerCase().includes(ql)), have = new Set(f.map(g => letter(g[0])));
  $("abc").innerHTML = [..."#ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(l => `<a href="#L${l}" class="${have.has(l) ? "" : "off"}">${l}</a>`).join("");
  let last = ""; $("list").innerHTML = f.map(([t, , d, w]) => { const l = letter(t), h = l !== last ? `<h2 class="ltr" id="L${l}">${l}</h2>` : ""; last = l;
    return h + `<details class="term" id="t-${encodeURIComponent(t)}" ${q ? "open" : ""}><summary>${t}</summary><p>${d}${w ? ` <a href="../${w}/">Mehr dazu: ${TITLE[w] || w} →</a>` : ""}</p></details>`; }).join("") || `<p class="none">Nichts gefunden. Versuch es mit einem anderen Wort.</p>`;
}
$("q").addEventListener("input", e => draw(e.target.value.trim()));
draw();
const h = decodeURIComponent(location.hash.slice(1)); if (h){ $("q").value = h; draw(h); }
})();
</script>
</body>
</html>
